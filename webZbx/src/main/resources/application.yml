#这个文件存放全局配置
server:
  port: 8080  # 应用启动端口

#数据库配置
spring:
  config:
    import: optional:classpath:application-local.yml  # 可选导入本地密码，clone 后自行创建
  datasource:
    url: jdbc:mysql://localhost:3306/online_exam?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}  # 实际密码在 application-local.yml（已 gitignore），部署时通过环境变量注入
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10  # 连接池最大连接数
  redis:
    host: localhost
    port: 6379
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

# MyBatis 配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true  # 自动将数据库字段 user_name 映射到 userName
  mapper-locations: classpath:mapper/*.xml  # MyBatis XML映射文件位置
  type-aliases-package: com.example.project.entity  # 实体类所在包

# 日志配置
logging:
  level:
    com.example.project: debug  # 打印你项目包下的debug日志
    org.springframework: info